; PlatformIO project for the ESP32 version of esp32-rf-blinds-controller.
; Arduino IDE users can ignore this file and open blinds/blinds.ino instead.

[platformio]
src_dir = blinds

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 57600
upload_speed = 921600

; Other boards work too, e.g.:
; [env:esp32-c3]
; platform = espressif32
; board = esp32-c3-devkitm-1
; framework = arduino
; monitor_speed = 57600
; build_flags = -DSTATUS_LED_PIN=-1
